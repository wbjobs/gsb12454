<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百万字长文本渲染方案对比</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>百万字长文本渲染方案对比</h1>
  <nav class="scheme-tabs" id="schemeTabs">
    <button data-scheme="full"    class="tab">整段渲染</button>
    <button data-scheme="paged"   class="tab">分页渲染</button>
    <button data-scheme="virtual" class="tab active">虚拟滚动</button>
    <button data-scheme="canvas"  class="tab">Canvas 绘制</button>
  </nav>
</header>

<section class="toolbar">
  <div class="search-group">
    <input id="searchInput" type="search" placeholder="搜索文本（防抖 250ms，Web Worker 执行）" autocomplete="off">
    <button id="prevMatch" title="上一个匹配">↑</button>
    <button id="nextMatch" title="下一个匹配">↓</button>
    <span id="matchInfo" class="match-info">未搜索</span>
  </div>
  <div class="jump-group">
    <input id="jumpInput" type="number" min="1" placeholder="行号">
    <button id="jumpBtn">跳转</button>
  </div>
  <div class="sample-group">
    <label for="fpsWindow">FPS 采样窗口</label>
    <select id="fpsWindow">
      <option value="250">250ms</option>
      <option value="500" selected>500ms</option>
      <option value="1000">1000ms</option>
      <option value="2000">2000ms</option>
    </select>
  </div>
</section>

<section class="metrics" id="metrics">
  <div class="metric"><span class="label">方案</span><span class="value" id="mScheme">-</span></div>
  <div class="metric"><span class="label">渲染耗时</span><span class="value" id="mRender">-</span></div>
  <div class="metric"><span class="label">FPS</span><span class="value" id="mFps">-</span></div>
  <div class="metric"><span class="label">JS 堆内存</span><span class="value" id="mMem">-</span></div>
  <div class="metric"><span class="label">DOM 节点</span><span class="value" id="mDom">-</span></div>
  <div class="metric"><span class="label">长任务(&gt;50ms)</span><span class="value" id="mLongtask">0</span></div>
  <div class="metric"><span class="label">搜索耗时</span><span class="value" id="mSearch">-</span></div>
</section>

<main id="viewport" class="viewport">
  <div class="loading" id="loading">正在生成 100 万字文本…</div>
</main>

<footer class="statusbar">
  <span id="textInfo">-</span>
  <span id="schemeNote"></span>
</footer>

<script src="js/textgen.js"></script>
<script src="js/metrics.js"></script>
<script src="js/renderers/common.js"></script>
<script src="js/renderers/full.js"></script>
<script src="js/renderers/paged.js"></script>
<script src="js/renderers/virtual.js"></script>
<script src="js/renderers/canvas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
